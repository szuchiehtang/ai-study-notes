<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 學習筆記</title>
  <meta name="description" content="AI 課程的學習筆記，一個主題一頁，每頁都用同一種格式整理。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&amp;family=Noto+Sans+TC:wght@400;500;700&amp;display=swap">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="home" data-root=".">
<div class="page">
  <header class="site-header">
    <a class="site-name" href="index.html">AI 學習筆記</a>
  </header>

  <main>
    <section class="intro">
      <h1>AI 學習筆記</h1>
      <p>這裡整理我在 AI 課程學到的概念。一個主題寫一頁，每一頁都用同一種格式：重點、概念、範例、誤區、自我檢核、延伸閱讀。</p>
    </section>

    <section aria-labelledby="catalog-title">
      <div class="catalog-head">
        <h2 id="catalog-title">目錄</h2>
        <!-- 標籤與目錄由 assets/site.js 依 data/notes.js 產生 -->
        <div id="tag-filter" class="tabs" role="group" aria-label="依標籤篩選"></div>
      </div>
      <ol id="note-list" class="note-list"></ol>
      <p id="note-empty" class="note-empty" hidden>這個標籤還沒有筆記。</p>
      <noscript><p class="note-empty">目錄需要開啟 JavaScript 才能顯示。</p></noscript>
    </section>
  </main>

  <footer class="site-footer">本站每一頁都依專案根目錄的 AGENTS.md 規則製作。</footer>
</div>
<script src="data/notes.js"></script>
<script src="assets/site.js"></script>
</body>
</html>
